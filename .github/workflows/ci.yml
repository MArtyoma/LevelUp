name: Проверка проекта

# Зачем это есть. В команде три человека без опыта разработки, и самая частая
# поломка — не «плохой код», а забытая запятая в JSON или ссылка на сотрудника,
# которого переименовали. Такая поломка обнаруживается на демо, а не при правке.
# CI переносит обнаружение на три минуты после push и никого не заставляет
# ничего помнить.
#
# Красный крестик в pull request означает ровно одно: «в master это не попадёт,
# пока не починим». Физически запрещает слияние защита ветки — она включается
# один раз в настройках репозитория (Settings → Branches → master → Require
# status checks). Без неё крестик — только предупреждение. Это не про строгость,
# а про то, чтобы у команды всегда был запускаемый билд (правило 3 плана по неделям).

on:
  push:
    branches: [main, master]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # D-012: все работают в одной версии. Редактор другой версии при сохранении
      # переписывает эту строку в project.godot — здесь это и ловится.
      - name: Версия движка в project.godot — 4.7
        run: |
          grep -q 'config/features=PackedStringArray("4.7"' project.godot || {
            echo "project.godot сохранён не в Godot 4.7 — см. D-012, поставьте 4.7.2"
            exit 1
          }

      - name: Скачать Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          # /usr/local/bin на раннере GitHub принадлежит root — без sudo шаг падает.
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Импорт ресурсов
        run: godot --headless --import

      - name: Проверка данных (data/*.json)
        run: godot --headless --script tools/validate_data.gd

      - name: Тесты
        run: godot --headless res://tests/test_runner.tscn
